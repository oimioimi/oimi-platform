<style>
/* =====================
   GLOBAL – FORCE WHITE
   ===================== */
*{ box-sizing:border-box; }
html,body{
  margin:0;
  padding:0;
  background:#ffffff !important;
  color:#000;
  font-family:'Segoe UI',Tahoma,sans-serif;
}
.container{
  max-width:600px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* =====================
   CARD
   ===================== */
.card{
  background:#ffffff !important;
  border-radius:20px;
  padding:18px;
  border:1px solid #eee;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

/* ==================================================
   OIMI LOGO – EXACT LIKE YOUR SCREENSHOT (RECT DOTS)
   O → black
   i → only dot red (RECTANGLE)
   M → black
   i → only dot red (RECTANGLE)
   .ae → black
   ================================================== */

:root{
  --page-bg:#ffffff;   /* must be white */
  --dot-red:#ff0000;
}

.oimi-logo{
  display:inline-flex;
  direction:ltr;
  align-items:baseline;
  font-weight:900;
  color:#000;
  line-height:1;
  letter-spacing:-0.4px;
  font-family:'Segoe UI',Tahoma,sans-serif;
}

/* title sizing (matches your screenshot look) */
.oimi-logo.title{
  font-size:56px;      /* adjust if you want */
  /* rectangle dot size */
  --dot-w: 0.18em;
  --dot-h: 0.10em;
  /* dot position (tight to the i) */
  --dot-top: -0.58em;

  /* mask to hide original dot */
  --mask-w: 0.32em;
  --mask-h: 0.32em;
  --mask-top: -0.72em;
}

/* inline sizing */
.oimi-logo.inline{
  font-size:1.05em;
  --dot-w: 0.18em;
  --dot-h: 0.10em;
  --dot-top: -0.58em;

  --mask-w: 0.32em;
  --mask-h: 0.32em;
  --mask-top: -0.72em;
}

/* the i */
.oimi-logo .i{
  position:relative;
  display:inline-block;
  color:#000;
}

/* hide the font original dot */
.oimi-logo .i::before{
  content:"";
  position:absolute;
  width:var(--mask-w);
  height:var(--mask-h);
  background:var(--page-bg);
  left:50%;
  transform:translateX(-50%);
  top:var(--mask-top);
  border-radius:0; /* IMPORTANT: no circle */
  z-index:1;
}

/* draw the red rectangle dot */
.oimi-logo .i::after{
  content:"";
  position:absolute;
  width:var(--dot-w);
  height:var(--dot-h);
  background:var(--dot-red);
  left:50%;
  transform:translateX(-50%);
  top:var(--dot-top);
  border-radius:0; /* rectangle like screenshot */
  z-index:2;
}

/* =====================
   TITLES
   ===================== */
.main-title{
  text-align:center;
  margin:0;
}
.sub-title{
  text-align:center;
  font-size:16px;
  color:#444;
  margin-top:6px;
}

/* =====================
   FORM
   ===================== */
label{
  display:block;
  margin:14px 0 6px;
  font-weight:700;
}
input,select,textarea{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
  background:#ffffff;
  font-size:14px;
}
textarea{ resize:vertical; }
.num-input{ direction:ltr; }

.btn{
  margin-top:16px;
  width:100%;
  padding:16px;
  border:none;
  border-radius:12px;
  background:#00732f;
  color:#fff;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
}
.btn:disabled{ opacity:.6; cursor:not-allowed; }

.status{
  display:none;
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  font-size:13px;
}
.status.error{ background:#fff1f1; color:#900; border:1px solid #f5bcbc; }
.status.success{ background:#f0fff4; color:#065f46; border:1px solid #9ae6b4; }
.status.info{ background:#f8fafc; color:#334155; border:1px solid #e5e7eb; }

/* =====================
   CLIENTS
   ===================== */
.section-title{
  text-align:center;
  font-size:18px;
  font-weight:900;
}
.section-sub{
  text-align:center;
  font-size:13px;
  color:#666;
}

.slider{
  overflow:hidden;
  direction:ltr;
  background:#ffffff !important;
}
.track{
  display:flex;
  gap:16px;
  animation:scroll 40s linear infinite;
}
.track img{
  width:260px;
  height:160px;
  border-radius:12px;
  object-fit:cover;
}
@keyframes scroll{
  from{ transform:translateX(0); }
  to{ transform:translateX(-50%); }
}

/* =====================
   FOOTER
   ===================== */
.footer-section{
  background:#ffffff !important;
  border-top:1px solid #eee;
  padding:20px;
  text-align:center;
}
.social-links{
  display:flex;
  justify-content:center;
  gap:24px;
  font-size:30px;
}
.social-links a{ color:#000; text-decoration:none; }
.fa-whatsapp{ color:#25D366; }
.fa-facebook{ color:#1877F2; }
.fa-linkedin{ color:#0A66C2; }
.fa-tiktok{ color:#000; }
.fa-instagram{
  background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="card">
    <div class="main-title">
      <span class="oimi-logo title" aria-label="OiMi.ae">
        O<span class="i">i</span>M<span class="i">i</span>.ae
      </span>
    </div>
    <div class="sub-title">طلب التقييم المهني وعمل السير الذاتية (ATS)</div>
  </div>

  <!-- CLIENTS -->
  <div class="card">
    <div class="section-title">مع عملائنا</div>
    <div class="section-sub">نماذج من تجارب وآراء عملائنا</div>
    <div class="slider">
      <div class="track" id="track">
        <img src="https://i.postimg.cc/vHPSwW3p/528604980-10162083330481298-381945114741787991-n.jpg" alt="">
        <img src="https://i.postimg.cc/sDn0Cpwb/585747945-10162491435001298-5020852638269490297-n.jpg" alt="">
        <img src="https://i.postimg.cc/Wb9fcMXY/QVZo-ZFNzc-Wdi-MUx2a-HJMUFRhe-GJza-TZI.jpg" alt="">
      </div>
    </div>
  </div>

  <!-- FORM -->
  <div class="card">
    <form id="oimi-form">
      <label>الاسم الرباعي (بالعربية)</label>

  <div class="footer-section">

      <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
      <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
    </div>
    <p style="font-size:12px;color:#aaa;margin-top:10px;">
      © 2026 OIMI.ae
    </p>
  </div>

</div>

<script>
/* duplicate slider for infinite loop */
const track=document.getElementById('track');
if(track){
  [...track.children].forEach(img=>{
    track.appendChild(img.cloneNode(true));
  });
}
</script>

</body>
