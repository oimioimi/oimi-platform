<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F3QLQPETRG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-F3QLQPETRG');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OiMi.ae | طلب تقييم مهني وصياغة سيرة ذاتية ATS</title>

  <meta name="description" content="منصة OiMi.ae للتقييم المهني وصياغة السير الذاتية المحسنة لأنظمة ATS مع إرشاد مهني متخصص.">
  <meta property="og:title" content="OiMi.ae | طلب تقييم مهني وصياغة سيرة ذاتية ATS">
  <meta property="og:description" content="حلول مهنية متكاملة تشمل التقييم المهني وصياغة السيرة الذاتية ATS والإرشاد الوظيفي.">
  <meta property="og:image" content="https://i.postimg.cc/cJRw69tq/Favicon-for-OIMI.png">
  <meta property="og:url" content="https://www.oimi.ae">
  <meta property="og:type" content="website">

  <link rel="icon" type="image/x-icon" href="https://i.postimg.cc/cJRw69tq/Favicon-for-OIMI.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root{--p:#00732f;--lg:#e8f5e9}
    body{margin:0;font-family:'Segoe UI',sans-serif;background:#fff;padding:6px}
    .container{max-width:600px;margin:auto;display:flex;flex-direction:column;gap:14px}

    .card{
      background:#fff;border:1px solid #eee;border-radius:20px;
      padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.08)
    }

    /* Logo */
    .oimi-style{display:inline-flex;direction:ltr;font-weight:900;color:#000}
    .oimi-i{
      background:linear-gradient(to bottom,#ff0000 20%,#000 20%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent
    }

    h1{text-align:center;margin:6px 0 8px;font-size:34px;font-weight:900}
    .about-text{color:#374151;font-size:16px;line-height:1.9;text-align:justify}

    .section-title{text-align:center;font-size:20px;font-weight:900;margin:6px 0}
    .section-sub{text-align:center;font-size:13px;color:#666}

    /* Slider */
    .slider{overflow:hidden;direction:ltr;height:240px}
    .track{display:flex;width:max-content;animation:scroll 40s linear infinite}
    .track img{
      width:240px;height:150px;object-fit:cover;margin:0 14px;
      border-radius:12px;cursor:zoom-in;
      box-shadow:0 6px 16px rgba(0,0,0,.1)
    }
    @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

    /* Form */
    label{display:block;margin-top:14px;font-weight:800;font-size:14px}
    input,select,textarea{
      width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;
      background:#f9f9f9;font-weight:700;margin-top:4px
    }
    .num-input{direction:ltr;text-align:left}

    .btn{
      width:100%;margin-top:16px;padding:16px;border:none;border-radius:12px;
      background:linear-gradient(135deg,#00732f,#00a342);
      color:#fff;font-size:18px;font-weight:900;cursor:pointer
    }
    .btn:disabled{background:#ccc}

    .status{
      display:none;margin-top:10px;padding:12px;border-radius:10px;font-size:13px
    }
    .status.error{background:#fff1f1;color:#8a0f0f;border:1px solid #ffc9c9}
    .status.success{background:#ecfdf3;color:#0b5d1e;border:1px solid #b7e4c7}
    .status.info{background:#eff6ff;color:#0b3a6a;border:1px solid #dbeafe}

    /* Footer */
    .footer-section{border-top:1px solid #eee;text-align:center;padding:18px}
    .social-links{display:flex;justify-content:center;gap:24px;margin-bottom:10px}
    .social-links a{font-size:30px;text-decoration:none}
    .fa-whatsapp{color:#25D366}
    .fa-tiktok{color:#000}
  </style>
</head>

<body>

<div id="modalOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center;z-index:9999"
     onclick="this.style.display='none'">
  <img id="modalImg" style="max-width:90%;max-height:80%;border-radius:10px;border:3px solid #fff">
</div>

<div class="container">

  <!-- H1 -->
  <div class="card">
    <h1>
      <span class="oimi-style">O<span class="oimi-i">i</span>M<span class="oimi-i">i</span>.ae</span>
    </h1>
    <p class="about-text">
      <span class="oimi-style">O<span class="oimi-i">i</span>M<span class="oimi-i">i</span>.ae</span>
      منصة رقمية متخصصة في التقييم المهني وصياغة السير الذاتية المحسّنة لأنظمة ATS،
      مع إرشاد مهني يراعي متطلبات سوق العمل في الشرق الأوسط وشمال أفريقيا.
    </p>
  </div>

  <!-- مع عملائنا -->
  <div class="card">
    <div class="section-title">مع عملائنا</div>
    <div class="section-sub">نماذج من تجارب عملائنا</div>

    <div class="slider">
      <div class="track" id="track">
        <img src="https://i.postimg.cc/vHPSwW3p/528604980-10162083330481298-381945114741787991-n.jpg" onclick="zoomImg(this.src)">
        <img src="https://i.postimg.cc/sDn0Cpwb/585747945-10162491435001298-5020852638269490297-n.jpg" onclick="zoomImg(this.src)">
        <img src="https://i.postimg.cc/Wb9fcMXY/QVZo-ZFNzc-Wdi-MUx2a-HJMUFRhe-GJza-TZI.jpg" onclick="zoomImg(this.src)">
        <img src="https://i.postimg.cc/kXjhPxf1/Screen-Shot-2022-01-14-at-9-42-42-AM.jpg" onclick="zoomImg(this.src)">
      </div>
    </div>
  </div>

  <!-- الطلب -->
  <div class="card">
    <div class="section-title">طلب التقييم المهني وعمل السير الذاتية (ATS)</div>

    <form id="oimi-form" novalidate>
      <label>الاسم الرباعي (بالعربية) *</label>
      <input id="u_name_ar" required>

      <label>الاسم الرباعي (بالإنجليزية) *</label>
      <input id="u_name_en" class="num-input" required>

      <label>التخصص المهني *</label>
      <input id="u_spec" required>

      <label>بلد الإقامة *</label>
      <select id="u_country" required>
        <option value="">اختر الدولة...</option>
        <option value="السودان">السودان</option>
        <option value="الإمارات">الإمارات</option>
        <option value="السعودية">السعودية</option>
        <option value="مصر">مصر</option>
        <option value="قطر">قطر</option>
        <option value="عمان">عمان</option>
      </select>

      <label>رقم الهاتف *</label>
      <input id="u_phone" class="num-input" required>

      <label>رقم الواتساب *</label>
      <input id="u_whatsapp" class="num-input" required>

      <label>البريد الإلكتروني *</label>
      <input id="u_email" type="email" required>

      <label>كيف سمعت عنا؟ *</label>
      <select id="u_source" required>
        <option value="فيسبوك">فيسبوك</option>
        <option value="لينكد إن">لينكد إن</option>
        <option value="تيك توك">تيك توك</option>
        <option value="انستقرام">انستقرام</option>
        <option value="صديق">عن طريق صديق</option>
      </select>

      <label>ملاحظات إضافية (اختياري)</label>
      <textarea id="u_notes"></textarea>

      <label>أرفق السيرة الذاتية *</label>
      <input id="cv_file" type="file" required>

      <label>أرفق إيصال التحويل *</label>
      <input id="receipt_file" type="file" required>

      <button class="btn" id="submitBtn">إرسال الطلب وحفظ البيانات</button>
      <div id="statusBox" class="status"></div>
    </form>
  </div>

  <div class="footer-section">
    <div class="social-links">
      <a href="https://wa.me/249900065080" target="_blank"><i class="fab fa-whatsapp"></i></a>
      <a href="https://www.tiktok.com/@oimi.ae" target="_blank"><i class="fab fa-tiktok"></i></a>
    </div>
    <p style="font-size:11px;color:#aaa">OiMi.ae © 2026</p>
  </div>

</div>

<script>
  const scriptURL="https://script.google.com/macros/s/AKfycbxn86Bymuy6kFwBVl3UC6fXD8UKJUpKwWN6fNefOHDX_6XFH1vbzXF_AwVd2HHxhzCT/exec";
  const OIMI_TOKEN="oimi22026";

  function zoomImg(src){
    modalImg.src=src;
    modalOverlay.style.display="flex";
  }

  const form=document.getElementById("oimi-form");
  const statusBox=document.getElementById("statusBox");

  form.addEventListener("submit",async e=>{
    e.preventDefault();
    statusBox.style.display="block";
    statusBox.className="status info";
    statusBox.textContent="جاري الإرسال...";

    try{
      const payload={
        "_token":OIMI_TOKEN,
        "الاسم العربي":u_name_ar.value,
        "الاسم الانجليزي":u_name_en.value,
        "التخصص المهني":u_spec.value,
        "بلد الإقامة":u_country.value,
        "رقم الهاتف":u_phone.value,
        "رقم الواتس":u_whatsapp.value,
        "البريد الإلكتروني":u_email.value,

        /* حل نهائي */
        "كيف سمعت عنا":u_source.value,
        "كيف سمعت عننا":u_source.value,

        "ملاحظات":u_notes.value
      };

      const r=await fetch(scriptURL,{method:"POST",body:JSON.stringify(payload)});
      const j=await r.json();

      if(j.status==="success"){
        statusBox.className="status success";
        statusBox.textContent="تم بنجاح ✅ رقم تسجيلك: "+j.uniqueId;
        form.reset();
      }else{
        throw new Error(j.message);
      }
    }catch(err){
      statusBox.className="status error";
      statusBox.textContent=err.message||"حدث خطأ أثناء الإرسال";
    }
  });
</script>

</body>
</html>
